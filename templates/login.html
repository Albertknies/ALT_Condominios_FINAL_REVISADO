<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALT — Login</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  <style>
    :root {
      --primary: #4F2C68;
      --primary-dark: #341846;
      --primary-light: #f5f0f8;
      --border: #e5e7eb;
      --text: #1e293b;
      --text-muted: #6b7280;
      --success: #10b981;
    }

    * { box-sizing: border-box; }

    body {
      background: #f8fafc;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    .top-navbar {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff;
      padding: 12px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-group img {
      width: 38px;
      height: 38px;
      border-radius: 7px;
      background: #fff;
      padding: 3px;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.2;
    }

    .brand-subtitle {
      font-size: 11px;
      opacity: .8;
      margin-top: 3px;
    }

    .login-main {
      width: 100%;
      max-width: 1200px;
      flex: 1;
      margin: 0 auto;
      padding: 42px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 32px;
      box-shadow: 0 8px 30px rgba(52, 24, 70, .08);
    }

    .login-header {
      text-align: center;
      margin-bottom: 26px;
    }

    .page-kicker {
      color: var(--primary);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    h1 {
      margin: 7px 0 0;
      font-size: 27px;
      line-height: 1.25;
      color: var(--text);
    }

    .flash {
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 16px;
      background: #fff;
      border: 1px solid var(--border);
      font-size: 13px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: #4b5563;
      font-size: 12px;
      font-weight: 700;
    }

    .field input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: #1f2937;
      padding: 12px 13px;
      font: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    .field input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 44, 104, .1);
    }

    .password-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-wrap input {
      padding-right: 84px;
    }

    .toggle-password {
      position: absolute;
      right: 8px;
      border: 0;
      border-radius: 6px;
      padding: 6px 9px;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .toggle-password:hover {
      background: #eadff0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      border: 1px solid var(--success);
      border-radius: 8px;
      padding: 12px 16px;
      background: var(--success);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, transform .15s;
    }

    .btn:hover {
      background: #059669;
    }

    .btn:active {
      transform: translateY(1px);
    }

    footer {
      padding: 18px 20px 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .top-navbar {
        padding: 14px 18px;
      }

      .login-main {
        padding: 28px 14px;
      }

      .login-card {
        padding: 26px 22px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <header class="top-navbar">
    <div class="brand-group">
      <img src="{{ url_for('static', filename='favicon.ico') }}" alt="ALT">
      <div>
        <div class="brand-title">ALT Gestão de Condomínios</div>
        <div class="brand-subtitle">Controle de acesso ao sistema</div>
      </div>
    </div>
  </header>

  <main class="login-main">
    <section class="login-card" aria-labelledby="login-title">
      <div class="login-header">
        <span class="page-kicker">Acesso seguro</span>
        <h1 id="login-title">Entrar no sistema</h1>
      </div>

      {% with messages=get_flashed_messages(with_categories=true) %}
        {% for cat,msg in messages %}
          <div class="flash {{ cat }}" role="alert">{{ msg }}</div>
        {% endfor %}
      {% endwith %}

      <form method="post" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="next" value="{{ next }}">

        <div class="field">
          <label for="login">E-mail ou usuário</label>
          <input id="login" name="login" type="text" autocomplete="username" placeholder="seu@email.com ou usuário" required autofocus>
        </div>

        <div class="field">
          <label for="password">Senha</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="toggle-password" data-target="password" aria-label="Mostrar senha">Mostrar</button>
          </div>
        </div>

        <button type="submit" class="btn">Entrar</button>
      </form>
    </section>
  </main>

  <footer>ALT Gestão de Condomínios · Sistema local</footer>

  <script>
    document.querySelectorAll('.toggle-password').forEach(function (button) {
      button.addEventListener('click', function () {
        const input = document.getElementById(this.dataset.target);
        if (!input) return;

        const showing = input.type === 'text';
        input.type = showing ? 'password' : 'text';
        this.textContent = showing ? 'Mostrar' : 'Ocultar';
        this.setAttribute('aria-label', showing ? 'Mostrar senha' : 'Ocultar senha');
      });
    });
  </script>
</body>
</html>
